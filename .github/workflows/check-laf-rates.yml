name: Vérification trimestrielle des taux art. 28 L.A.F.

on:
  schedule:
    - cron: "15 13 15 3,6,9,12 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-laf-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Durcir l'environnement du runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Vérifier la couverture du trimestre à venir
        id: check
        run: |
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("src/data/laf_art28_rates.json", "utf8"));
            const now = new Date();
            // Regarde 21 jours devant (ex. 15 déc. -> 5 janv. -> Q1 suivant)
            const target = new Date(now.getTime() + 21 * 86400 * 1000);
            const y = target.getUTCFullYear();
            const q = Math.floor(target.getUTCMonth() / 3) + 1;
            const nextQuarter = `${y}-Q${q}`;
            const covered = Object.prototype.hasOwnProperty.call(data.quarters, nextQuarter);
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `next_quarter=${nextQuarter}\n`);
            fs.appendFileSync(out, `covered=${covered}\n`);
            fs.appendFileSync(out, `last_quarter=${data.metadata.last_quarter}\n`);
            fs.appendFileSync(out, `source_url=${data.metadata.source_url}\n`);
            console.log({ nextQuarter, covered, lastQuarter: data.metadata.last_quarter });
          '
      - name: Ouvrir un billet de rappel si le prochain trimestre manque
        if: steps.check.outputs.covered == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEXT_QUARTER: ${{ steps.check.outputs.next_quarter }}
          LAST_QUARTER: ${{ steps.check.outputs.last_quarter }}
          SOURCE_URL: ${{ steps.check.outputs.source_url }}
        with:
          script: |
            const nextQuarter = process.env.NEXT_QUARTER ?? "";
            const lastQuarter = process.env.LAST_QUARTER ?? "";
            const sourceUrl = process.env.SOURCE_URL ?? "";
            const title = `[art. 28 L.A.F.] Vérifier et ajouter le taux ${nextQuarter}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            if (existing.data.some((issue) => issue.title === title)) {
              core.info(`Issue already open for ${nextQuarter}.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `La table embarquée [\`src/data/laf_art28_rates.json\`](src/data/laf_art28_rates.json) s'arrête actuellement à **${lastQuarter}**.`,
                "",
                `Le trimestre **${nextQuarter}** approche. Vérifiez la publication officielle de Revenu Québec et mettez à jour :`,
                `- \`quarters["${nextQuarter}"]\` (en points de base, p. ex. \`700\` pour 7,00 %)`,
                `- \`metadata.last_quarter\` et \`metadata.table_version\` (\`"${nextQuarter}"\`)`,
                `- \`metadata.verified_at\``,
                "",
                `Source officielle : ${sourceUrl}`,
                "",
                "Ensuite, exécutez :",
                "```bash",
                "npm run type-check && npm test && npm run deploy",
                "```",
              ].join("\n"),
            });
