name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Contrôle 1/3 — le secret CLOUDFLARE_API_TOKEN parvient-il au job ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            case "$CLOUDFLARE_API_TOKEN" in
              *[[:space:]]*)
                echo "::error title=Le jeton contient une espace ou un saut de ligne::Recoller la valeur dans l'environnement « production » sans espace ni retour chariot."
                exit 1
                ;;
            esac
            echo "Le secret est présent et ne porte aucune espace."
            exit 0
          fi
          echo "::error title=CLOUDFLARE_API_TOKEN est VIDE dans ce job::Définir le secret dans l'environnement GitHub « production » (gh secret set CLOUDFLARE_API_TOKEN --env production -R jpoirierlavoie/MCP-Outils)."
          exit 1

      - name: Contrôle 2/3 — Cloudflare accepte-t-il ce jeton ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq est absent de l'image du runner."; exit 1; }
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/verify.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
          statut=$(jq -r '.result.status // "inconnu"' /tmp/verify.json 2>/dev/null || echo inconnu)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/verify.json 2>/dev/null || echo "")
          case "$code" in
            200)
              echo "Jeton reconnu, statut « ${statut} »."
              if [ "$statut" != "active" ]; then
                echo "::error title=Jeton non actif (${statut})::Un jeton expiré ou suspendu se remplace."
                exit 1
              fi
              ;;
            401|403)
              echo "::error title=Jeton REFUSÉ par Cloudflare (HTTP ${code})::${motifs:-aucun motif rendu}."
              exit 1
              ;;
            000)
              echo "::error title=api.cloudflare.com injoignable::Vérifier la politique réseau du runner."
              exit 1
              ;;
            *)
              echo "::notice title=Vérification non concluante (HTTP ${code})::${motifs:-sans motif}. Non bloquant pour un jeton de compte."
              ;;
          esac

      - name: Contrôle 3/3 — le jeton désigne-t-il UN SEUL compte ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CF_COMPTE=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Compte fourni par la configuration."
            exit 0
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/comptes.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/accounts || echo 000)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/comptes.json 2>/dev/null || echo "")
          if [ "$code" != "200" ]; then
            echo "::error title=Le jeton ne peut pas énumérer les comptes (HTTP ${code})::${motifs:-sans motif}. Ajouter « Account Settings: Read » au jeton ou définir CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          n=$(jq '[.result[]?] | length' /tmp/comptes.json)
          echo "Comptes visibles par ce jeton : ${n}."
          if [ "$n" -ne 1 ]; then
            echo "::error title=Comptes visibles attendus = 1, obtenu = ${n}::Ajuster la portée du jeton ou définir CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          compte=$(jq -r '.result[0].id' /tmp/comptes.json)
          echo "::add-mask::$compte"
          echo "CF_COMPTE=$compte" >> "$GITHUB_ENV"
          echo "Un seul compte : Wrangler le choisira sans ambiguïté."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Audit des dépendances
        run: npm run audit

      - name: Déploiement sur Cloudflare Workers (wrangler deploy)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_COMPTE }}
          ATTENDU_LONG: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${ATTENDU_LONG:0:7}"
          npx wrangler deploy --var "COMMIT:${tag}" --tag "$tag" --message "Deploy ${tag} (GitHub Actions)"

      - name: Vérification vivante (/health, /mcp/server-card, métadonnées OAuth et portes fermées)
        if: success()
        env:
          ATTENDU_LONG: ${{ github.sha }}
          SANTE: https://outils.poirierlavoie.ca/health
          CARTE: https://outils.poirierlavoie.ca/mcp/server-card
          PRM: https://outils.poirierlavoie.ca/.well-known/oauth-protected-resource/mcp/oauth
          MCP_OAUTH_URL: https://outils.poirierlavoie.ca/mcp/oauth
          MCP_URL: https://outils.poirierlavoie.ca/mcp
        run: |
          set -euo pipefail
          attendu="${ATTENDU_LONG:0:7}"
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$SANTE" || echo 000)
            enligne=$(jq -r '.commit // "absent"' /tmp/health.json 2>/dev/null || echo absent)
            if [ "$code" = "200" ] && [ "$enligne" = "$attendu" ]; then
              echo "Production alignée sur /health : HTTP 200, commit=${enligne} (tentative ${i}/12)."
              ok=1
              break
            fi
            echo "Tentative ${i}/12 : /health HTTP ${code}, commit=${enligne} (attendu ${attendu})."
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=Vérification /health échouée::${SANTE} n'a pas rendu HTTP 200 avec commit=${attendu}."
            exit 1
          fi
          code_carte=$(curl -sS --max-time 20 -o /tmp/server-card.json -w '%{http_code}' "$CARTE" || echo 000)
          if [ "$code_carte" != "200" ]; then
            echo "::error title=Fiche /mcp/server-card en échec (HTTP ${code_carte})::${CARTE} a répondu HTTP ${code_carte}."
            exit 1
          fi
          code_prm=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$PRM" || echo 000)
          if [ "$code_prm" != "200" ]; then
            echo "::error title=Métadonnées RFC 9728 en échec (HTTP ${code_prm})::${PRM} a répondu HTTP ${code_prm}."
            exit 1
          fi
          code_oauth=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST "$MCP_OAUTH_URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            || echo 000)
          if [ "$code_oauth" != "401" ]; then
            echo "::error title=Porte OAuth /mcp/oauth mal protégée (HTTP ${code_oauth})::Attendu 401."
            exit 1
          fi
          code_mcp=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            || echo 000)
          if [ "$code_mcp" != "404" ]; then
            echo "::error title=Porte porteur /mcp non muette (HTTP ${code_mcp})::Attendu 404 sans jeton."
            exit 1
          fi
          echo "Vérification vivante complète : /health=200, /mcp/server-card=200, PRM=200, /mcp/oauth=401, /mcp=404."
