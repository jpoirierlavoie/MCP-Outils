name: deploy

# Déploiement continu vers Cloudflare Workers (`outils.poirierlavoie.ca`).
#
# Gardes stricts :
#   1. 3 contrôles préalables en LECTURE SEULE sur `api.cloudflare.com` (jeton présent sans
#      espace ni retour chariot, reconnu actif par Cloudflare, compte unique).
#   2. Porte complète hors réseau (`npm run typecheck`, `npm test`, `npm run build`,
#      `npx wrangler deploy --dry-run`).
#   3. Déploiement supervisé (`npx wrangler deploy --tag <sha7> --message ...`) ciblant
#      l'environnement GitHub `production` avec file `deploy-production` sérialisée.
#   4. Vérification vivante post-déploiement sur `/healthz` et `POST /mcp` (`initialize`).
#
# Aucune expression `${{ }}` n'apparaît dans un `run:` : tout passe par `env:`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── LES TROIS CONTRÔLES PRÉALABLES (lecture seule) ──────────────────────
      - name: Contrôle 1/3 — le secret CLOUDFLARE_API_TOKEN parvient-il au job ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            case "$CLOUDFLARE_API_TOKEN" in
              *[[:space:]]*)
                echo "::error title=Le jeton contient une espace ou un saut de ligne::Recoller la valeur dans l'environnement « production » sans espace ni retour chariot."
                exit 1
                ;;
            esac
            echo "Le secret est présent et ne porte aucune espace."
            exit 0
          fi
          echo "::error title=CLOUDFLARE_API_TOKEN est VIDE dans ce job::Définir le secret dans l'environnement GitHub « production » (gh secret set CLOUDFLARE_API_TOKEN --env production -R jpoirierlavoie/MCP-Outils)."
          exit 1

      - name: Contrôle 2/3 — Cloudflare accepte-t-il ce jeton ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq est absent de l'image du runner."; exit 1; }
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/verify.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
          statut=$(jq -r '.result.status // "inconnu"' /tmp/verify.json 2>/dev/null || echo inconnu)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/verify.json 2>/dev/null || echo "")
          case "$code" in
            200)
              echo "Jeton reconnu, statut « ${statut} »."
              if [ "$statut" != "active" ]; then
                echo "::error title=Jeton non actif (${statut})::Un jeton expiré ou suspendu se remplace."
                exit 1
              fi
              ;;
            401|403)
              echo "::error title=Jeton REFUSÉ par Cloudflare (HTTP ${code})::${motifs:-aucun motif rendu}."
              exit 1
              ;;
            000)
              echo "::error title=api.cloudflare.com injoignable::Vérifier la politique réseau du runner."
              exit 1
              ;;
            *)
              echo "::notice title=Vérification non concluante (HTTP ${code})::${motifs:-sans motif}. Non bloquant pour un jeton de compte."
              ;;
          esac

      - name: Contrôle 3/3 — le jeton désigne-t-il UN SEUL compte ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CF_COMPTE=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Compte fourni par la configuration."
            exit 0
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/comptes.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/accounts || echo 000)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/comptes.json 2>/dev/null || echo "")
          if [ "$code" != "200" ]; then
            echo "::error title=Le jeton ne peut pas énumérer les comptes (HTTP ${code})::${motifs:-sans motif}. Ajouter « Account Settings: Read » au jeton ou définir CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          n=$(jq '[.result[]?] | length' /tmp/comptes.json)
          echo "Comptes visibles par ce jeton : ${n}."
          if [ "$n" -ne 1 ]; then
            echo "::error title=Comptes visibles attendus = 1, obtenu = ${n}::Ajuster la portée du jeton ou définir CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          compte=$(jq -r '.result[0].id' /tmp/comptes.json)
          echo "::add-mask::$compte"
          echo "CF_COMPTE=$compte" >> "$GITHUB_ENV"
          echo "Un seul compte : Wrangler le choisira sans ambiguïté."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Paquet de déploiement (à blanc)
        run: npx wrangler deploy --dry-run

      - name: Déploiement sur Cloudflare Workers (wrangler deploy)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_COMPTE }}
          ATTENDU_LONG: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${ATTENDU_LONG:0:7}"
          npx wrangler deploy --var "COMMIT:${tag}" --tag "$tag" --message "Deploy ${tag} (GitHub Actions)"

      - name: Vérification vivante (/healthz, /mcp/server-card et /mcp initialize)
        if: success()
        env:
          ATTENDU_LONG: ${{ github.sha }}
          SANTE: https://outils.poirierlavoie.ca/healthz
          CARTE: https://outils.poirierlavoie.ca/mcp/server-card
          MCP_URL: https://outils.poirierlavoie.ca/mcp
        run: |
          set -euo pipefail
          attendu="${ATTENDU_LONG:0:7}"
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS --max-time 20 -o /tmp/healthz.json -w '%{http_code}' "$SANTE" || echo 000)
            enligne=$(jq -r '.commit // "absent"' /tmp/healthz.json 2>/dev/null || echo absent)
            if [ "$code" = "200" ] && [ "$enligne" = "$attendu" ]; then
              echo "Production alignée sur /healthz : HTTP 200, commit=${enligne} (tentative ${i}/12)."
              ok=1
              break
            fi
            echo "Tentative ${i}/12 : /healthz HTTP ${code}, commit=${enligne} (attendu ${attendu})."
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=Vérification /healthz échouée::${SANTE} n'a pas rendu HTTP 200 avec commit=${attendu}."
            exit 1
          fi
          code_carte=$(curl -sS --max-time 20 -o /tmp/server-card.json -w '%{http_code}' "$CARTE" || echo 000)
          if [ "$code_carte" != "200" ]; then
            echo "::error title=Fiche /mcp/server-card en échec (HTTP ${code_carte})::${CARTE} a répondu HTTP ${code_carte}."
            exit 1
          fi
          code_mcp=$(curl -sS --max-time 20 -o /tmp/mcp-init.txt -w '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-actions-smoke","version":"1.0.0"}}}' \
            || echo 000)
          if [ "$code_mcp" != "200" ]; then
            echo "::error title=Initialisation MCP en échec (HTTP ${code_mcp})::${MCP_URL} a répondu HTTP ${code_mcp}."
            exit 1
          fi
          if ! grep -q '"serverInfo"' /tmp/mcp-init.txt; then
            echo "::error title=Réponse MCP inattendue::serverInfo absent dans la réponse d'initialisation."
            exit 1
          fi
          echo "Vérification vivante complète : /healthz=200, /mcp/server-card=200, POST /mcp initialize=200."
