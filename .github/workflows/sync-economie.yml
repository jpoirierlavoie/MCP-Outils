name: Synchronisation DB_ECONOMIE (taux BdC, change, IPC StatCan et loyers SCHL)

on:
  schedule:
    - cron: "15 22 * * 1-5" # Jours ouvrables : FX_RATES_DAILY + V39079/V122530/V80691311
    - cron: "30 14 20 * *"  # Mensuel (le 20) : IPC StatCan 18-10-0004-01/05 + SCHL 34-10-0133-01
  workflow_dispatch:
    inputs:
      mode:
        description: "Jeu de données à synchroniser"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - fx
          - statcan

permissions:
  contents: read

concurrency:
  group: sync-economie
  cancel-in-progress: false

jobs:
  sync-economie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Durcir l'environnement du runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Contrôle 1/2 — vérifier la présence de CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN absent."
            exit 1
          fi
          case "$CLOUDFLARE_API_TOKEN" in
            *[[:space:]]*)
              echo "::error::CLOUDFLARE_API_TOKEN contient un espace ou saut de ligne."
              exit 1
              ;;
          esac

      - name: Contrôle 2/2 — résoudre CLOUDFLARE_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CF_COMPTE=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/comptes.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/accounts || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Impossible de résoudre le compte Cloudflare (HTTP ${code})."
            exit 1
          fi
          n=$(jq '[.result[]?] | length' /tmp/comptes.json)
          if [ "$n" -ne 1 ]; then
            echo "::error::Comptes visibles attendus = 1, obtenu = ${n}."
            exit 1
          fi
          compte=$(jq -r '.result[0].id' /tmp/comptes.json)
          echo "::add-mask::$compte"
          echo "CF_COMPTE=$compte" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Synchronisation incrémentale D1 (FX_RATES_DAILY + V39079/V122530/V80691311)
        if: github.event.schedule == '15 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'fx'))
        env:
          PYTHONUTF8: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_COMPTE }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pipeline.economie.ingest_economie --incremental-fx --push-remote

      - name: Synchronisation mensuelle D1 (IPC StatCan 18-10-0004/05 + SCHL 34-10-0133)
        if: github.event.schedule == '30 14 20 * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'statcan'))
        env:
          PYTHONUTF8: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_COMPTE }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pipeline.economie.ingest_economie --sync-statcan --push-remote
