name: verifier-deploiement

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-deploiement
  cancel-in-progress: true

jobs:
  comparer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: La version en ligne est-elle celle de main ?
        env:
          ATTENDU_LONG: ${{ github.sha }}
          SANTE: https://outils.poirierlavoie.ca/health
        run: |
          set -euo pipefail
          attendu="${ATTENDU_LONG:0:7}"

          code=$(curl -sS --max-time 20 -o /tmp/sante.json -w '%{http_code}' "$SANTE" || echo 000)

          if [ "$code" = "000" ]; then
            echo "::error title=Le point d'entrée de santé est injoignable::Aucune conclusion possible sur la version en ligne."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error title=/health a répondu ${code}::La mesure de santé a échoué."
            exit 1
          fi

          enligne=$(jq -r '.commit // "absent"' /tmp/sante.json)

          if [ "$enligne" = "absent" ] || [ "$enligne" = "inconnu" ]; then
            echo "::error title=La version en ligne n'annonce pas son commit::Redéployer avec `--var COMMIT:<sha7>` pour rétablir l'annonce de commit."
            exit 1
          fi

          if [ "$enligne" = "$attendu" ]; then
            echo "::notice title=Production à jour::La version en ligne est le commit ${attendu}, dernier de main."
            exit 0
          fi

          echo "::error title=La production est en retard sur main::En ligne : ${enligne}. Dernier commit de main : ${attendu}. Exécuter « deploy.yml »."
          echo "Comparer les deux : https://github.com/${GITHUB_REPOSITORY}/compare/${enligne}...${attendu}"
          exit 1
